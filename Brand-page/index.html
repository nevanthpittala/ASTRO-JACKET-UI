<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"/>

  <link rel="stylesheet" href="brand-style.css">

  <title>Reload Brand UI</title>
</head>

<body>

  <div id="wrapper">

    <header id="top-bar">

      <div id="logo">
        <i class="ri-asterisk"></i>
      </div>

      <div id="top-right-text">
         SHAPE <br>
         THE FUTURE
      </div>

    </header>


    <main id="hero-section">

      

      <section id="main-content"> 
          <div id="left-side-text">
             <a href="">OUR</a> 
             <a href="">LATEST</a>
             <a href="">PROJECTS</a>
           </div>

           <div id="hero-text">
             <h1>
                RELOAD DESIGNS MAKE <br>
                BRAND SYSTEMS THAT
             </h1>
             <h2>
              REDEFINE MODERN <br>
              <span>VISUAL CULTURE</span>
             </h2>

            </div>


           <div id="intro-text">
              Reload builds brands that cut through noise,
              challenge clichés, and actually sell.
            </div>


           <div id="gallery">
              <div class="card">
                  <img src="images/model.png" alt="">
              </div>

               <div class="card">
                    <img src="images/side.png" alt="">
               </div>

                <div class="card">
                   <img src="images/third.png" alt="">
               </div>

            </div>


            <div id="bottom-heading">

                <h2>
                 EVERYTHING <span>YOUR </span><br>
                  <span>NEEDS</span> TO GROW
                </h2>

                <p>
                  Reload offers strategic branding,
                  visual identity and creative direction.
               </p>

            </div>

        </section>

    </main>

  </div>

</body>
</html>
